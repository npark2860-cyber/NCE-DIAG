name: Build D3DX9_43 ARM64

on:
  push:
    branches:
      - exp/d3dx9-43-arm64-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Ninja
        shell: pwsh
        run: choco install -y ninja

      - name: Install Flex and Bison
        shell: pwsh
        run: |
          curl.exe -L -o flexbison.7z https://svn.reactos.org/storage/vperevertkin/flexbison.7z
          7z x flexbison.7z -o"${{ github.workspace }}\bin"
          "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BISON_PKGDATADIR=${{ github.workspace }}\bin\share\bison" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "M4=${{ github.workspace }}\bin\m4.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Activate MSVC ARM64 cross tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
          toolset: '14'

      - name: Clone ReactOS
        shell: pwsh
        run: git clone --depth 1 https://github.com/reactos/reactos.git src

      - name: Patch standalone ARM64 D3DX build
        shell: pwsh
        run: |
          $path = 'src\dll\directx\wine\d3dx9_36\d3dx9.cmake'
          $text = Get-Content $path -Raw
          $old = 'target_link_libraries(${module} dxguid wine oldnames)'
          $new = 'target_link_libraries(${module} dxguid wine)'
          if (-not $text.Contains($old)) { throw 'Expected oldnames link line not found' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -NoNewline

      - name: Configure ReactOS ARM64
        shell: pwsh
        run: |
          cmake -S src -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-msvc.cmake `
            -DARCH:STRING=arm64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build d3dx9_43 only
        shell: pwsh
        run: cmake --build build --target d3dx9_43 -- -k0

      - name: Collect and verify DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter d3dx9_43.dll | Select-Object -First 1
          if (-not $dll) { throw 'd3dx9_43.dll was not produced' }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $dll.FullName artifact\D3DX9_43.dll
          dumpbin /headers artifact\D3DX9_43.dll | Tee-Object -FilePath artifact\PE_HEADERS.txt
          dumpbin /exports artifact\D3DX9_43.dll | Tee-Object -FilePath artifact\EXPORTS.txt
          @(
            'Source: https://github.com/reactos/reactos',
            "Source commit: $(git -C src rev-parse HEAD)",
            'Patch: remove ReactOS oldnames static library from standalone D3DX target',
            'Target: d3dx9_43',
            'Architecture: Windows ARM64',
            'Configuration: Release',
            "Built at UTC: $([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content artifact\BUILD_INFO.txt
          Get-FileHash artifact\D3DX9_43.dll -Algorithm SHA256 | Format-List | Out-String | Set-Content artifact\SHA256.txt

      - name: Upload D3DX9_43 ARM64
        uses: actions/upload-artifact@v4
        with:
          name: d3dx9_43-windows-arm64
          path: artifact
          if-no-files-found: error
