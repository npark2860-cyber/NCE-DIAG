name: Build FBNeo DX9 ARM64 Runtime

on:
  push:
    branches:
      - exp/d3dx9-43-arm64-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Ninja
        shell: pwsh
        run: choco install -y ninja

      - name: Install Flex and Bison
        shell: pwsh
        run: |
          curl.exe -L -o flexbison.7z https://svn.reactos.org/storage/vperevertkin/flexbison.7z
          7z x flexbison.7z -o"${{ github.workspace }}\bin"
          "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BISON_PKGDATADIR=${{ github.workspace }}\bin\share\bison" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "M4=${{ github.workspace }}\bin\m4.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Activate MSVC ARM64 cross tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
          toolset: '14'

      - name: Clone ReactOS
        shell: pwsh
        run: git clone --depth 1 https://github.com/reactos/reactos.git src

      - name: Patch standalone ARM64 D3DX build
        shell: pwsh
        run: |
          $cmakePath = 'src\dll\directx\wine\d3dx9_36\d3dx9.cmake'
          $text = Get-Content $cmakePath -Raw
          $old = 'target_link_libraries(${module} dxguid wine oldnames)'
          $new = 'target_link_libraries(${module} dxguid wine)'
          if (-not $text.Contains($old)) { throw 'Expected oldnames link line not found' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $cmakePath -Value $text -NoNewline

          $effectPath = 'src\dll\directx\wine\d3dx9_36\effect.c'
          $effect = Get-Content $effectPath -Raw
          if (-not $effect.Contains('stricmp(')) { throw 'Expected stricmp call not found' }
          $effect = $effect.Replace('stricmp(', '_stricmp(')
          Set-Content -Path $effectPath -Value $effect -NoNewline

      - name: Configure ReactOS ARM64
        shell: pwsh
        run: |
          cmake -S src -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-msvc.cmake `
            -DARCH:STRING=arm64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build runtime DLLs
        shell: pwsh
        run: cmake --build build --target d3dx9_43 d3dcompiler_43 d3dxof -- -k0

      - name: Collect and verify runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null

          $files = @(
            @{ Search='d3dx9_43.dll';      Out='D3DX9_43.dll' },
            @{ Search='d3dcompiler_43.dll'; Out='D3DCompiler_43.dll' },
            @{ Search='d3dxof.dll';         Out='D3DXOF.dll' }
          )

          foreach ($f in $files) {
            $dll = Get-ChildItem -Path build -Recurse -Filter $f.Search | Select-Object -First 1
            if (-not $dll) { throw "$($f.Search) was not produced" }
            Copy-Item $dll.FullName (Join-Path artifact $f.Out)
            dumpbin /headers (Join-Path artifact $f.Out) | Set-Content (Join-Path artifact "$($f.Out).HEADERS.txt")
            dumpbin /dependents (Join-Path artifact $f.Out) | Set-Content (Join-Path artifact "$($f.Out).DEPENDENTS.txt")
          }

          dumpbin /exports artifact\D3DX9_43.dll | Set-Content artifact\D3DX9_43.EXPORTS.txt

          @(
            'Source: https://github.com/reactos/reactos',
            "Source commit: $(git -C src rev-parse HEAD)",
            'Patch: remove ReactOS oldnames static library from standalone D3DX target',
            'Patch: map legacy stricmp call to MSVC _stricmp',
            'Targets: d3dx9_43, d3dcompiler_43, d3dxof',
            'Architecture: Windows ARM64',
            'Configuration: Release',
            'Use: place the three DLLs beside the ARM64 FBNeo executable for testing',
            "Built at UTC: $([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content artifact\BUILD_INFO.txt

          Get-ChildItem artifact -Filter *.dll | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content artifact\SHA256.txt

      - name: Upload FBNeo DX9 ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-dx9-arm64-runtime
          path: artifact
          if-no-files-found: error
